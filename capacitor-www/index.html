<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Flowdesk</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0f766e;
        color: #fafaf9;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        opacity: 0.85;
        max-width: 22rem;
        line-height: 1.45;
      }
      code {
        font-size: 0.85em;
        background: rgba(0, 0, 0, 0.25);
        padding: 0.15em 0.4em;
        border-radius: 0.35em;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Flowdesk</h1>
      <p>
        Opening your workspace… If this stays on screen, set
        <code>FLOWDESK_URL</code> and run <code>npm run android:sync</code>.
      </p>
    </div>
  </body>
</html>
